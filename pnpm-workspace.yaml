shellEmulator: true
ignoreScripts: true
catalogMode: prefer
minimumReleaseAge: 5760
trustPolicy: no-downgrade
strictDepBuilds: true
blockExoticSubdeps: true

overrides:
  chokidar: 5.0.0
  tinyclip: 0.1.14

catalogs:
  astro:
    "@astrojs/check": 0.9.9
    "@astrojs/cloudflare": 13.6.0
    "@astrojs/markdown-satteri": 0.2.2
    "@astrojs/mdx": 6.0.1
    "@astrojs/sitemap": 3.7.3
    astro: 6.4.4

  dev:
    typescript: 6.0.3
    wrangler: 4.96.0

  icons:
    "@iconify-json/lucide": 1.2.111
    "@iconify-json/ph": 1.2.2
    unplugin-icons: 23.0.1

  linting:
    oxfmt: 0.53.0
    oxlint: 1.68.0

  styling:
    "@tailwindcss/vite": 4.3.0
    tailwindcss: 4.3.0

  types:
    "@types/node": 24.12.2

minimumReleaseAgeExclude:
  - "@astrojs/markdown-satteri@0.2.2"
  - "@bruits/satteri-darwin-arm64@0.8.0"
  - "@bruits/satteri-darwin-x64@0.8.0"
  - "@bruits/satteri-linux-x64-gnu@0.8.0"
  - "@bruits/satteri-wasm32-wasi@0.8.0"
  - "@bruits/satteri-win32-x64-msvc@0.8.0"
  - astro@6.4.4
  - satteri@0.8.0
  - tinyclip@0.1.14
