shellEmulator: true
ignoreScripts: true
catalogMode: prefer
minimumReleaseAge: 5760
trustPolicy: no-downgrade
strictDepBuilds: true
blockExoticSubdeps: true

overrides:
  chokidar: 5.0.0
  tinyclip: 0.1.14

catalogs:
  astro:
    "@astrojs/check": 0.9.9
    "@astrojs/cloudflare": 14.0.0
    "@astrojs/markdown-satteri": 0.3.2
    "@astrojs/mdx": 7.0.0
    "@astrojs/sitemap": 3.7.3
    astro: 7.0.2

  dev:
    typescript: 6.0.3
    wrangler: 4.103.0

  icons:
    "@iconify-json/lucide": 1.2.111
    "@iconify-json/ph": 1.2.2
    unplugin-icons: 23.0.1

  linting:
    oxfmt: 0.53.0
    oxlint: 1.68.0

  styling:
    "@tailwindcss/vite": 4.3.0
    tailwindcss: 4.3.0

  types:
    "@types/node": 24.12.2

minimumReleaseAgeExclude:
  - "@astrojs/markdown-satteri@0.3.2"
  - astro@7.0.2
  - satteri@0.8.0
  - tinyclip@0.1.14
  - '@astrojs/cloudflare@14.0.0'
  - '@astrojs/mdx@7.0.0'
